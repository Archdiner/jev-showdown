name: hybrid
extends: champion.yaml
search:
  id: hybrid
  params:
    depth: 1
    samples: 1
    timeBudgetMs: 7000
hybrid:
  id: layers
  params:
    worlds: 4
    sampler: loose
    samples: 1
    tera: true
    enrichDecisionState: true
    maxActions: 8
    maxReplies: 3
    regretIterations: 24
    # Model calls stay in the branch and off. Turn plan or judgment on in a
    # separate file; the shipped hybrid and the screens do not.
    plan: false
    opponent: false
    judgment: false
    everyTurn: false
    margin: 0.75
    planEvery: 4
    model: alibaba/qwen3.8-27b
    # Opus is the optional planner (effort low). Qwen on Cerebras returns inside a turn.
    plannerModel: alibaba/qwen3.8-27b
    maxTokens: 10000
