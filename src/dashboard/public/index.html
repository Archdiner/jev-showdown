<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>jev live games</title>
  <style>
    :root { color-scheme: dark; --bg: #121417; --panel: #1c2128; --line: #30363d; --text: #e6edf3; --muted: #8b949e; --link: #79c0ff; --strategy: #3fb950; --timer: #d29922; --crash: #f85149; }
    body { margin: 0; font: 14px/1.4 ui-sans-serif, system-ui, sans-serif; background: var(--bg); color: var(--text); }
    header, section, form { padding: 12px 16px; }
    h1 { margin: 0 0 4px; font-size: 18px; }
    p { margin: 4px 0; color: var(--muted); }
    .rates { display: flex; flex-wrap: wrap; gap: 8px; }
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; min-width: 160px; }
    .card strong { display: block; font-size: 16px; color: var(--text); }
    .card.strategy { border-color: var(--strategy); }
    .card.timer { border-color: var(--timer); }
    .card.crash { border-color: var(--crash); }
    form { display: flex; gap: 16px; flex-wrap: wrap; align-items: end; }
    label { display: flex; flex-direction: column; gap: 4px; color: var(--muted); }
    select { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 6px; }
    .wrap { overflow-x: auto; padding: 0 16px 24px; }
    table { border-collapse: collapse; width: max-content; min-width: 100%; }
    th, td { border-bottom: 1px solid var(--line); padding: 6px 8px; text-align: left; white-space: nowrap; }
    th { color: var(--muted); font-weight: 600; position: sticky; top: 0; background: var(--bg); }
    a { color: var(--link); }
    tr.timer-disconnect td:first-child { box-shadow: inset 3px 0 var(--timer); }
    tr.crash td:first-child { box-shadow: inset 3px 0 var(--crash); }
    tr.strategy td:first-child { box-shadow: inset 3px 0 var(--strategy); }
    tr.unclassified td:first-child { box-shadow: inset 3px 0 var(--muted); }
  </style>
</head>
<body>
  <header>
    <h1>Live games</h1>
    <p id="meta">Loading…</p>
  </header>
  <section class="rates" id="rates"></section>
  <form id="filters">
    <label>End reason
      <select id="endReason">
        <option value="any">any</option>
        <option value="strategy">strategy (KO / forfeit)</option>
        <option value="timer-disconnect">timer / disconnect</option>
        <option value="ko">ko</option>
        <option value="opponent-forfeit">opponent-forfeit</option>
        <option value="our-forfeit">our-forfeit</option>
        <option value="timer-ours">timer-ours</option>
        <option value="timer-theirs">timer-theirs</option>
        <option value="disconnect">disconnect</option>
        <option value="crash">crash</option>
      </select>
    </label>
    <label>Opponent rating
      <select id="band">
        <option value="any">any</option>
        <option value="unknown">unknown</option>
        <option value="under-1200">under 1200</option>
        <option value="1200-1399">1200–1399</option>
        <option value="1400-1599">1400–1599</option>
        <option value="1600-plus">1600+</option>
      </select>
    </label>
  </form>
  <p id="filtered"></p>
  <div class="wrap">
    <table>
      <thead>
        <tr>
          <th>Replay</th><th>Opponent</th><th>Opp rating</th><th>Rating before</th><th>Rating after</th>
          <th>Result</th><th>End reason</th><th>Loss class</th><th>Duration</th>
          <th>Latency p50</th><th>p95</th><th>max</th><th>Min timer</th>
          <th>Engine</th><th>Config</th><th>Config hash</th><th>Git</th><th>Concurrency</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <script src="/app.js"></script>
</body>
</html>
